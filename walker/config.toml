# Theme selection (maps to ~/.config/walker/themes/your_theme)
theme = "matugen"

# Window & Behavior settings
force_keyboard_focus = false
close_when_open = true
click_to_close = true
selection_wrap = false
disable_mouse = false
debug = false

# Search settings
global_argument_delimiter = "#"
exact_search_prefix = "'"

# Wayland Layer Shell anchoring (positions the window on screen)
[shell]
anchor_top = true
anchor_bottom = false
anchor_left = false
anchor_right = false

# Default providers to query and display
[providers]
default = [
    "desktopapplications",
    "calc",
    "runner",
    "menus",
    "websearch"
]
empty = ["desktopapplications"]
max_results = 50

# Placeholder text for the input bar and empty states
[placeholders]
[placeholders.default]
input = "Search..."
list = "No Results"

[placeholders.desktopapplications]
input = "Launch App"
list = "No Applications Found"

# Keybindings
[keybinds]
close = ["Escape"]
next = ["Down"]
previous = ["Up"]
toggle_exact = ["ctrl e"]
resume_last_query = ["ctrl r"]
quick_activate = ["F1", "F2", "F3", "F4"]
